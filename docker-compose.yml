services:
  db:
    image: postgres:15-alpine
    container_name: whatshouldicook_db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  test_db_data:
